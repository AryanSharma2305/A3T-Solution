<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="100%" height="100%" fill="none">
  <defs>
    <!-- Cyan Neon Aura Filter -->
    <filter id="a3tGlowFilter" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Main 3D Ribbon Cyan-to-Cobalt Gradient -->
    <linearGradient id="a3tMainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="25%" stop-color="#00C8FF" />
      <stop offset="60%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0038D1" />
    </linearGradient>

    <!-- Right Tubular Leg Gradient -->
    <linearGradient id="a3tRightLegGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="30%" stop-color="#0099FF" />
      <stop offset="70%" stop-color="#0055EE" />
      <stop offset="100%" stop-color="#0022AA" />
    </linearGradient>

    <!-- Inner Ribbon Fold Shadow Gradient -->
    <linearGradient id="a3tFoldShadow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#002288" />
      <stop offset="50%" stop-color="#0044CC" />
      <stop offset="100%" stop-color="#0099FF" />
    </linearGradient>

    <!-- Pixel Blocks Glow Gradient -->
    <linearGradient id="a3tPixelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#0077FF" />
    </linearGradient>

    <!-- Specular Highlight Curve -->
    <linearGradient id="a3tGlossCurve" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0077FF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow Backdrop -->
  <circle cx="160" cy="140" r="100" fill="#00B4FF" opacity="0.12" filter="url(#a3tGlowFilter)" />

  <!-- === The Official A3T 3D Ribbon 'A' Mark === -->
  <g transform="translate(10, 8)">
    <!-- 1. Floating Pixel Cubes on the Far Left -->
    <!-- Top Cube -->
    <rect x="36" y="96" width="22" height="22" rx="5" fill="url(#a3tPixelGrad)" filter="url(#a3tGlowFilter)" />
    <rect x="38" y="98" width="10" height="4" rx="2" fill="#FFFFFF" opacity="0.75" />

    <!-- Bottom-Left Cube -->
    <rect x="14" y="162" width="24" height="24" rx="5" fill="url(#a3tPixelGrad)" filter="url(#a3tGlowFilter)" />
    <rect x="16" y="164" width="11" height="4" rx="2" fill="#FFFFFF" opacity="0.7" />

    <!-- Bottom-Right Cube -->
    <rect x="44" y="194" width="23" height="23" rx="5" fill="url(#a3tPixelGrad)" filter="url(#a3tGlowFilter)" />
    <rect x="46" y="196" width="10" height="4" rx="2" fill="#FFFFFF" opacity="0.7" />

    <!-- 2. Protruding Horizontal Cyber Bars / Equalizer Fingers -->
    <!-- Upper Bar extending from the left stem -->
    <path 
      d="M 62 124 L 115 124 C 122 124, 126 128, 126 135 C 126 142, 122 146, 115 146 L 62 146 Z" 
      fill="url(#a3tPixelGrad)" 
      filter="url(#a3tGlowFilter)" 
    />
    <rect x="66" y="127" width="36" height="3" rx="1.5" fill="#FFFFFF" opacity="0.75" />

    <!-- Lower Bar extending from the left stem -->
    <path 
      d="M 62 154 L 102 154 C 108 154, 112 158, 112 165 C 112 172, 108 176, 102 176 L 62 176 Z" 
      fill="url(#a3tPixelGrad)" 
      filter="url(#a3tGlowFilter)" 
    />
    <rect x="66" y="157" width="24" height="3" rx="1.5" fill="#FFFFFF" opacity="0.75" />

    <!-- 3. Left Stem Base (Slanted Solid Bevel) -->
    <path 
      d="M 64 246 L 138 246 C 146 246, 150 242, 154 234 L 188 160 C 192 152, 188 144, 178 144 L 122 144 C 114 144, 108 150, 104 158 L 60 236 C 56 242, 58 246, 64 246 Z" 
      fill="url(#a3tFoldShadow)" 
    />

    <!-- 4. Inner Ribbon Fold / Crossbar Loop -->
    <path 
      d="M 122 144 C 134 144, 146 138, 152 128 L 176 84 C 182 74, 192 68, 204 68 C 216 68, 224 76, 222 88 L 198 148 C 194 158, 186 166, 176 166 L 130 166 Z" 
      fill="url(#a3tFoldShadow)" 
    />

    <!-- 5. Main 3D Continuous Arch & Right Tubular Pillar -->
    <!-- Ambient Shadow Behind Pillar -->
    <path 
      d="M 170 34 C 196 14, 230 18, 246 44 C 256 60, 256 80, 250 102 L 202 214 C 196 228, 186 240, 170 246 C 154 252, 140 244, 136 230 C 132 216, 138 202, 146 186 L 186 96 C 192 82, 188 68, 178 58 C 170 50, 156 46, 144 48 Z" 
      fill="#001855" 
      opacity="0.45" 
      transform="translate(6, 6)"
    />

    <!-- Main Front 3D Ribbon Body -->
    <path 
      d="M 166 32 C 194 12, 232 18, 248 44 C 258 60, 256 82, 250 104 L 200 216 C 194 230, 182 242, 166 248 C 150 254, 136 244, 132 230 C 128 214, 134 200, 144 182 L 184 94 C 190 80, 186 66, 176 56 C 166 48, 152 44, 140 48 Z" 
      fill="url(#a3tMainGradient)" 
      filter="url(#a3tGlowFilter)"
    />

    <!-- Glossy Highlight Along Outer Curved Shoulder -->
    <path 
      d="M 172 36 C 196 18, 228 24, 242 46 C 248 56, 248 70, 244 88 L 198 190" 
      stroke="url(#a3tGlossCurve)" 
      stroke-width="4.5" 
      stroke-linecap="round" 
      fill="none" 
    />

    <!-- Rounded Cylindrical Bottom Foot of Right Pillar -->
    <ellipse cx="152" cy="236" rx="15" ry="9" fill="#00F5FF" opacity="0.85" />
    <circle cx="152" cy="236" r="4.5" fill="#FFFFFF" opacity="0.95" />
  </g>
</svg>
